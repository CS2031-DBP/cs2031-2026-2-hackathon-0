name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No desplegar un sitio roto
        run: python3 scripts/audit.py

      # Sin `enablement: true` a propósito: el token del workflow no puede
      # crear el sitio de Pages y el error que da es críptico. Es mejor que el
      # equipo lo active a mano una vez y que este paso falle con el mensaje
      # claro de "verify that the repository has Pages enabled".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
